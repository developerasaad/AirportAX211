name: AirportAX211 dual-macOS build

# AirportAX211 — specialized Intel AX211 AirportItlwm for
# MSI Modern 14 C12MO (Intel Wi-Fi 6E AX211 160 MHz, PCI 8086:51f0).
#
# Products:
#   AirportItlwm-Sequoia -> AirportItlwm.kext for macOS 15 (Darwin 24.x)
#   AirportItlwm-Tahoe   -> AirportItlwm.kext for macOS 26 (Darwin 25.x)
# Both x86_64 only.
#
# The build operates entirely on this repository's source checked out from
# main. It has no dependency on any upstream branch or local reference tree.

on:
  push:
    branches: [main]
    paths:
      - 'itlwm/**'
      - 'itl80211/**'
      - 'AirportItlwm/**'
      - 'include/**'
      - 'itlwm.xcodeproj/**'
      - 'scripts/**'
      - '.github/workflows/main.yml'
  pull_request:
    branches: [main]
    paths:
      - 'itlwm/**'
      - 'itl80211/**'
      - 'AirportItlwm/**'
      - 'include/**'
      - 'itlwm.xcodeproj/**'
      - 'scripts/**'
      - '.github/workflows/main.yml'
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode build configuration
        type: choice
        required: true
        default: Debug
        options: [Debug, Release]

permissions:
  contents: read

concurrency:
  group: airportax211-build
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify (Sequoia + Tahoe, x86_64)
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: MacKernelSDK
      - name: Expose public Tahoe MSI-X API
        run: python3 scripts/prepare_tahoe_sdk.py
      - name: Build Sequoia and Tahoe x86_64 kexts
        env:
          CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
        run: |
          set -euo pipefail
          mkdir -p logs artifacts
          xcodebuild -version > logs/toolchain.txt 2>&1 || true
          sw_vers > logs/os-version.txt 2>&1 || true
          git rev-parse HEAD > logs/source-commit.txt
          SHORT_SHA=$(git rev-parse --short HEAD)
          MODULE_VERSION=$(awk '/MODULE_VERSION =/ {gsub(/;/, "", $3); print $3; exit}' itlwm.xcodeproj/project.pbxproj)
          echo "module_version=$MODULE_VERSION short_sha=$SHORT_SHA"
          for platform in Sequoia Tahoe; do
            echo "=== building AirportItlwm-$platform ($CONFIGURATION) ==="
            xcodebuild -project itlwm.xcodeproj -target "AirportItlwm-$platform" \
              -configuration "$CONFIGURATION" -jobs 3 ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
              SYMROOT="$PWD/build/products" OBJROOT="$PWD/build/obj" \
              CODE_SIGNING_ALLOWED=NO \
              GIT_COMMIT="_${SHORT_SHA}" \
              build > "logs/build-$platform.txt" 2>&1 || {
                echo "=== FAIL: AirportItlwm-$platform build failed ==="
                grep -n -B2 -A5 'error:' "logs/build-$platform.txt" | head -120 || true
                tail -40 "logs/build-$platform.txt"
                exit 1
              }
            echo "=== built AirportItlwm-$platform ==="
          done
      - name: Verify kernel extensions
        env:
          CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          MODULE_VERSION=$(awk '/MODULE_VERSION =/ {gsub(/;/, "", $3); print $3; exit}' itlwm.xcodeproj/project.pbxproj)
          for platform in Sequoia Tahoe; do
            kext="build/products/$CONFIGURATION/$platform/AirportItlwm.kext"
            echo "=== verifying $platform: $kext ==="
            test -d "$kext" || { echo "FAIL: $platform kext missing"; exit 1; }
            bin="$kext/Contents/MacOS/AirportItlwm"
            test -f "$bin" || { echo "FAIL: $platform kext binary missing"; exit 1; }
            # Architecture must be x86_64 only (AX211 target is Intel macOS).
            lipo -info "$bin" | tee -a logs/verify-$platform.txt
            lipo -info "$bin" | grep -q "x86_64" || { echo "FAIL: $platform wrong architecture"; exit 1; }
            lipo -info "$bin" | grep -q "arm64" && { echo "FAIL: $platform arm64 slice leaked"; exit 1; } || true
            # Bundle metadata sanity.
            plutil -lint "$kext/Contents/Info.plist" | tee -a logs/verify-$platform.txt
            bundle_id=$(plutil -extract CFBundleIdentifier raw "$kext/Contents/Info.plist")
            version=$(plutil -extract CFBundleVersion raw "$kext/Contents/Info.plist")
            echo "bundle_id=$bundle_id version=$version" | tee -a logs/verify-$platform.txt
            [ "$bundle_id" = "com.zxystd.AirportItlwm" ] || { echo "FAIL: $platform unexpected bundle id"; exit 1; }
            # Required kext libraries present.
            plutil -convert xml1 -o "/tmp/kext-info-$platform.plist" "$kext/Contents/Info.plist"
            for lib in com.apple.iokit.IO80211Family com.apple.kpi.libkern com.apple.kpi.iokit; do
              grep -q "<key>$lib</key>" "/tmp/kext-info-$platform.plist" || { echo "FAIL: $platform missing OSBundleLibrary $lib"; exit 1; }
            done
            grep -q "<key>com.apple.iokit.IOSkywalkFamily</key>" "/tmp/kext-info-$platform.plist" || { echo "FAIL: $platform must link IOSkywalkFamily"; exit 1; }
            grep -q "<key>com.apple.driver.corecapture</key>" "/tmp/kext-info-$platform.plist" || { echo "FAIL: $platform must link corecapture"; exit 1; }
            # Record embedded firmware families (FwBinary.cpp embeds the
            # itlwm/firmware payloads; names appear in the binary).
            strings "$bin" > "/tmp/fw-strings-$platform.txt" || true
            echo "--- firmware families embedded in $platform binary ---" | tee -a logs/verify-$platform.txt
            grep -o "iwlwifi-[a-z0-9-]*" "/tmp/fw-strings-$platform.txt" | sort -u | tee -a logs/verify-$platform.txt || true
            # Record the PCI matching table for traceability.
            echo "--- IOPCIMatch ($platform) ---" | tee -a logs/verify-$platform.txt
            plutil -extract IOKitPersonalities.IOPCIPrimaryMatch raw "$kext/Contents/Info.plist" 2>/dev/null | tee -a logs/verify-$platform.txt || true
            # Record binary identity.
            dwarfdump --uuid "$bin" > "artifacts/UUID-$platform.txt" 2>&1 || true
            shasum -a 256 "$bin" | tee "artifacts/AirportItlwm-$platform.bin.sha256"
            # Package this platform separately, with revision recorded.
            suffix="v${MODULE_VERSION}-AX211-${platform}-${CONFIGURATION}-${SHORT_SHA}"
            ditto -c -k --keepParent "$kext" "artifacts/AirportItlwm-${suffix}.zip"
            shasum -a 256 "artifacts/AirportItlwm-${suffix}.zip" > "artifacts/AirportItlwm-${suffix}.zip.sha256"
            echo "AirportAX211 v${MODULE_VERSION} ${platform} ${CONFIGURATION} ${SHORT_SHA}" > "artifacts/AirportItlwm-${suffix}.txt"
            echo "source_commit=$(git rev-parse HEAD)" >> "artifacts/AirportItlwm-${suffix}.txt"
          done
          cp logs/source-commit.txt artifacts/ || true
          cp LICENSE iwlwifi-firmware-license artifacts/
          ls -la artifacts
      - name: Upload Sequoia artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirportItlwm-Sequoia-${{ inputs.configuration || 'Debug' }}-${{ github.sha }}
          path: artifacts/AirportItlwm-*Sequoia*
          retention-days: 14
          if-no-files-found: error
      - name: Upload Tahoe artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirportItlwm-Tahoe-${{ inputs.configuration || 'Debug' }}-${{ github.sha }}
          path: artifacts/AirportItlwm-*Tahoe*
          retention-days: 14
          if-no-files-found: error
      - name: Upload compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: logs/
          retention-days: 14
